<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account | MALI MALI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #fff; color: #000; -webkit-font-smoothing: antialiased; }
    .tracking-luxury { letter-spacing: 0.25em; }
    input { border-bottom: 1px solid #e5e7eb !important; border-radius: 0 !important; }
    input:focus { border-color: #000 !important; outline: none; }
    .tab-active { border-bottom: 2px solid #000; color: #000; }
    .tab-inactive { border-bottom: 2px solid transparent; color: #9ca3af; }
  </style>
</head>
<body>

  <nav class="fixed top-0 w-full z-50 h-20 bg-white flex items-center justify-between px-6 lg:px-10">
    <a href="index.html" class="text-[10px] font-bold uppercase tracking-luxury hover:opacity-50">← Home</a>
    <div class="absolute left-1/2 -translate-x-1/2 text-xl font-black tracking-tighter uppercase cursor-pointer" onclick="window.location.href='index.html'">
      MALI MALI
    </div>
  </nav>

  <main class="pt-40 pb-32 px-6 lg:px-16 max-w-md mx-auto">
    <div class="text-center mb-16">
      <h1 class="text-4xl font-black uppercase tracking-tighter mb-4 italic">Welcome Back</h1>
      <p class="text-[10px] font-bold uppercase tracking-luxury text-zinc-400">Sign In or Create Account</p>
    </div>

    <!-- Tab Navigation -->
    <div class="flex mb-12">
      <button id="signin-tab" class="flex-1 py-4 text-[10px] font-black uppercase tracking-widest tab-active transition-colors" onclick="showSignIn()">
        Sign In
      </button>
      <button id="signup-tab" class="flex-1 py-4 text-[10px] font-black uppercase tracking-widest tab-inactive transition-colors" onclick="showSignUp()">
        Create Account
      </button>
    </div>

    <!-- Sign In Form -->
    <div id="signin-form" class="space-y-8">
      <div>
        <input type="email" placeholder="EMAIL ADDRESS" class="w-full py-4 bg-transparent text-[10px] font-bold uppercase tracking-widest" required>
      </div>
      <div>
        <input type="password" placeholder="PASSWORD" class="w-full py-4 bg-transparent text-[10px] font-bold uppercase tracking-widest" required>
      </div>
      <div class="flex justify-between items-center">
        <label class="flex items-center">
          <input type="checkbox" class="mr-3">
          <span class="text-[8px] font-bold uppercase tracking-widest">Remember Me</span>
        </label>
        <a href="#" class="text-[8px] font-bold uppercase tracking-widest hover:underline">Forgot Password?</a>
      </div>
      <button type="submit" class="bg-black text-white w-full py-6 text-[10px] font-black uppercase tracking-luxury hover:bg-zinc-900 transition">
        Sign In
      </button>
    </div>

    <!-- Sign Up Form -->
    <div id="signup-form" class="space-y-8 hidden">
      <div>
        <input type="text" placeholder="FIRST NAME" class="w-full py-4 bg-transparent text-[10px] font-bold uppercase tracking-widest" required>
      </div>
      <div>
        <input type="text" placeholder="LAST NAME" class="w-full py-4 bg-transparent text-[10px] font-bold uppercase tracking-widest" required>
      </div>
      <div>
        <input type="email" placeholder="EMAIL ADDRESS" class="w-full py-4 bg-transparent text-[10px] font-bold uppercase tracking-widest" required>
      </div>
      <div>
        <input type="password" placeholder="PASSWORD" class="w-full py-4 bg-transparent text-[10px] font-bold uppercase tracking-widest" required>
      </div>
      <div>
        <input type="password" placeholder="CONFIRM PASSWORD" class="w-full py-4 bg-transparent text-[10px] font-bold uppercase tracking-widest" required>
      </div>
      <div class="flex items-start">
        <input type="checkbox" class="mt-1 mr-3" required>
        <span class="text-[8px] font-bold uppercase tracking-widest leading-relaxed">
          I agree to the <a href="terms.html" class="hover:underline">Terms of Service</a> and <a href="privacy.html" class="hover:underline">Privacy Policy</a>
        </span>
      </div>
      <button type="submit" class="bg-black text-white w-full py-6 text-[10px] font-black uppercase tracking-luxury hover:bg-zinc-900 transition">
        Create Account
      </button>
    </div>

    <!-- Social Sign In -->
    <div class="mt-16 pt-8 border-t border-zinc-200">
      <p class="text-center text-[8px] font-bold uppercase tracking-widest text-zinc-400 mb-6">Or Continue With</p>
      <div class="grid grid-cols-3 gap-4">
        <button class="border border-zinc-200 py-4 text-[8px] font-black uppercase tracking-widest hover:bg-zinc-50 transition">
          Google
        </button>
        <button class="border border-zinc-200 py-4 text-[8px] font-black uppercase tracking-widest hover:bg-zinc-50 transition">
          Facebook
        </button>
        <button class="border border-zinc-200 py-4 text-[8px] font-black uppercase tracking-widest hover:bg-zinc-50 transition">
          Instagram
        </button>
      </div>
    </div>
  </main>

  <footer class="bg-black text-white py-12 text-center">
    <p class="text-[8px] tracking-[0.4em] uppercase opacity-50">© 2026 MALI MALI LTD.</p>
  </footer>

  <script>
    function showSignIn() {
      document.getElementById('signin-form').classList.remove('hidden');
      document.getElementById('signup-form').classList.add('hidden');
      document.getElementById('signin-tab').className = 'flex-1 py-4 text-[10px] font-black uppercase tracking-widest tab-active transition-colors';
      document.getElementById('signup-tab').className = 'flex-1 py-4 text-[10px] font-black uppercase tracking-widest tab-inactive transition-colors';
    }

    function showSignUp() {
      document.getElementById('signin-form').classList.add('hidden');
      document.getElementById('signup-form').classList.remove('hidden');
      document.getElementById('signin-tab').className = 'flex-1 py-4 text-[10px] font-black uppercase tracking-widest tab-inactive transition-colors';
      document.getElementById('signup-tab').className = 'flex-1 py-4 text-[10px] font-black uppercase tracking-widest tab-active transition-colors';
    }
  </script>

</body>
</html>
