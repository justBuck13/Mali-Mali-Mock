<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | MALI MALI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #fff; color: #000; -webkit-font-smoothing: antialiased; }
    .tracking-luxury { letter-spacing: 0.25em; }
    input, textarea { border-bottom: 1px solid #e5e7eb !important; border-radius: 0 !important; }
    input:focus, textarea:focus { border-color: #000 !important; outline: none; }
  </style>
</head>
<body>

  <nav class="fixed top-0 w-full z-50 h-20 bg-white flex items-center justify-between px-6 lg:px-10">
    <a href="index.html" class="text-[10px] font-bold uppercase tracking-luxury hover:opacity-50">← Home</a>
    <div class="absolute left-1/2 -translate-x-1/2 text-xl font-black tracking-tighter uppercase cursor-pointer" onclick="window.location.href='index.html'">
      MALI MALI
    </div>
  </nav>

  <main class="pt-40 pb-32 px-6 lg:px-16 max-w-7xl mx-auto">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-24">
      
      <div>
        <h1 class="text-6xl font-black uppercase tracking-tighter mb-8 italic">Get in Touch</h1>
        <p class="text-[10px] font-bold uppercase tracking-luxury text-zinc-400 mb-16">Direct Channels</p>
        
        <div class="space-y-10">
          <div>
            <span class="block text-[10px] font-black uppercase tracking-widest text-zinc-400 mb-2">Support Email</span>
            <a href="mailto:support@malimali.com" class="text-sm font-bold uppercase tracking-widest hover:underline">Support@malimali.co</a>
          </div>
          <div>
            <span class="block text-[10px] font-black uppercase tracking-widest text-zinc-400 mb-2">WhatsApp</span>
            <a href="#" class="text-sm font-bold uppercase tracking-widest hover:underline">+27 00 000 0000</a>
          </div>
          <div>
            <span class="block text-[10px] font-black uppercase tracking-widest text-zinc-400 mb-2">Studio Hours</span>
            <p class="text-sm font-bold uppercase tracking-widest">MON — FRI / 09:00 — 17:00</p>
          </div>
        </div>
      </div>

      <form class="space-y-12">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
          <input type="text" placeholder="NAME" class="w-full py-4 bg-transparent text-[10px] font-bold uppercase tracking-widest">
          <input type="email" placeholder="EMAIL" class="w-full py-4 bg-transparent text-[10px] font-bold uppercase tracking-widest">
        </div>
        <input type="text" placeholder="SUBJECT" class="w-full py-4 bg-transparent text-[10px] font-bold uppercase tracking-widest">
        <textarea placeholder="MESSAGE" rows="4" class="w-full py-4 bg-transparent text-[10px] font-bold uppercase tracking-widest resize-none"></textarea>
        
        <button type="submit" class="bg-black text-white w-full py-6 text-[10px] font-black uppercase tracking-luxury hover:bg-zinc-900 transition">
          Send Inquiry
        </button>
      </form>

    </div>
  </main>

  <footer class="bg-black text-white py-12 text-center">
    <p class="text-[8px] tracking-[0.4em] uppercase opacity-50">© 2026 MALI MALI LTD.</p>
  </footer>

</body>
</html>
